project:
  type: book
  output-dir: docs

profile:
  group:
    - [basic]
  default: basic

book:
  title: "A Grammar of the Classical Arabic Language"
  author: "Mortimer Sloper Howell"
  date: now
  #chapters:
  #  - index.qmd
  #  - part: "Part I"
  #    chapters:
  #      - content/1-01.qmd
  description: |
    Translated and compiled from the works of the most approved native or naturalized authorities
  site-url: https://adamiturabi.github.io/howell-navigator/
  repo-url: https://github.com/adamiturabi/howell-navigator
  repo-branch: main
  repo-actions: [issue]
  # sharing: [twitter]
  page-navigation: true
  search: true
  sidebar:
    collapse-level: 1

website:
  reader-mode: true

format:
  html:
    mainfont: "CharisW"
    mainfontoptions: Numbers=OldStyle
    sansfont: "CharisW"
    monofont: "DejaVu Sans Mono" # set size in CSS using class "sourceCode"
    #fontsize: 10pt
    theme:
      - cosmo # body text is a little grey which is good.
      - srchtml/custom.scss
    css: srchtml/styles.css
    #include-before-body: srchtml/watermark.html
    linkcolor: "hsl(210,10.3448275862%,47.7450980392%)" # obtained by inspecting webpage
    page-layout: full
    grid:
      sidebar-width: 200px
      body-width: 1500px
      margin-width: 0px
      gutter-width: 1.5rem
    toc: false # no right contents bar
    #toc-location: left
    #toc-title: "Chapter contents"
    # background color. see also srchtml/custom.scss
    backgroundcolor: "#FDFBF7" # ultra light ivory
    #backgroundcolor: "#FCFBF9" # soft powder
    #backgroundcolor: "#FAF9F5" # alabaster
    #backgroundcolor: "#F7F6F0" # warm linen
    #backgroundcolor: "#F7F4F0" # warm linen less green

#keep-md: true
filters:
  - arabic-support
  #- filters/autoref-link.lua
  #- filters/lingex.lua
  - filters/footnotesize.lua
  - filters/citex.lua
  - filters/translation.lua
  - filters/reset-examples.lua

